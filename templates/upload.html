<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Uploader</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>📤 LAN Uploader</h1>
    <div class="muted">Mobile‑first, drag‑and‑drop, remembers your last folder</div>
  </header>

  <div class="stack">
    <label class="muted" for="target_dir">Save to subdirectory (relative to server root)</label>
    <div class="row">
      <input id="target_dir" name="target_dir" type="text" placeholder="e.g. myuser/Documents" value="{{ last_dir }}">
      <button id="browse_btn" type="button" title="Browse server folders">Browse</button>
    </div>

    <div id="browser" class="dirbrowser hidden">
      <div class="crumbs" id="crumbs"></div>
      <div class="dirlist" id="dirlist"></div>
      <div class="row" style="margin-top:8px;">
        <span class="pill">Tip: Tap folders to drill in. Tap "Use This Folder" to select.</span>
        <button id="use_folder" type="button" style="margin-left:auto;">Use This Folder</button>
      </div>
    </div>

    <input id="file_input" class="hidden" type="file" name="files" multiple accept="*/*" capture>
    <div id="dropzone" class="dropzone">
      <div><strong>Tap to choose</strong> or <strong>drop files</strong></div>
      <div class="muted">Camera capture supported on many phones</div>
    </div>

    <div id="file_preview" class="file-preview hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <strong>Selected Files</strong>
        <button id="clear_files" type="button" style="background: #666; font-size: 14px; padding: 6px 10px;">Clear All</button>
      </div>
      <div id="file_list"></div>
    </div>

    <button id="upload_btn" type="button">Upload</button>

    <div id="progress_container" class="progress-container hidden">
      <div id="progress_bar" class="progress-bar"></div>
      <div id="progress_text" class="progress-text">0%</div>
    </div>

    <div id="status" class="center muted"></div>
  </div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
