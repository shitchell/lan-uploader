<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Uploader</title>
  <style>
    :root { --pad: 14px; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; margin: 0; padding: var(--pad); max-width: 720px; margin-inline: auto; }
    header { text-align: center; margin-bottom: 10px; }
    h1 { font-size: 1.2rem; margin: 0; }
    .row { display: flex; gap: 8px; align-items: center; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; }
    button, .btn { padding: 12px 14px; font-size: 16px; border: none; background: #2d7ef7; color: white; border-radius: 10px; }
    button:active { filter: brightness(0.93); }
    .muted { color: #666; font-size: 0.9rem; }
    .dropzone {
      border: 2px dashed #999; border-radius: 16px; padding: 24px; text-align: center; color: #555; user-select: none;
    }
    .dropzone.dragover { background: #f4f7ff; border-color: #2d7ef7; color: #2d7ef7; }
    .hidden { display: none; }
    .dirbrowser { border: 1px solid #ddd; border-radius: 12px; padding: 10px; }
    .crumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .crumbs a { text-decoration: none; background: #f2f2f2; padding: 4px 8px; border-radius: 999px; color: #333; }
    .dirlist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dir { padding: 10px; border: 1px solid #eee; border-radius: 10px; background: #fafafa; cursor: pointer; }
    .dir:active { filter: brightness(0.95); }
    .success { color: #0a7a28; }
    .error { color: #a40000; }
    .pill { font-size: 12px; background: #eef0f7; color: #4a4d57; border-radius: 999px; padding: 2px 8px; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>📤 LAN Uploader</h1>
    <div class="muted">Mobile‑first, drag‑and‑drop, remembers your last folder</div>
  </header>

  <div class="stack">
    <label class="muted" for="target_dir">Save to subdirectory (relative to server root)</label>
    <div class="row">
      <input id="target_dir" name="target_dir" type="text" placeholder="e.g. myuser/Documents" value="{{ last_dir }}">
      <button id="browse_btn" type="button" title="Browse server folders">Browse</button>
    </div>

    <div id="browser" class="dirbrowser hidden">
      <div class="crumbs" id="crumbs"></div>
      <div class="dirlist" id="dirlist"></div>
      <div class="row" style="margin-top:8px;">
        <span class="pill">Tip: Tap folders to drill in. Tap "Use This Folder" to select.</span>
        <button id="use_folder" type="button" style="margin-left:auto;">Use This Folder</button>
      </div>
    </div>

    <input id="file_input" class="hidden" type="file" name="files" multiple accept="*/*" capture>
    <div id="dropzone" class="dropzone">
      <div><strong>Tap to choose</strong> or <strong>drop files</strong></div>
      <div class="muted">Camera capture supported on many phones</div>
    </div>

    <button id="upload_btn" type="button">Upload</button>
    <div id="status" class="center muted"></div>
  </div>

<script>
const dz = document.getElementById('dropzone');
const fi = document.getElementById('file_input');
const upBtn = document.getElementById('upload_btn');
const statusEl = document.getElementById('status');
const targetInput = document.getElementById('target_dir');
const browseBtn = document.getElementById('browse_btn');
const browser = document.getElementById('browser');
const crumbs = document.getElementById('crumbs');
const dirlist = document.getElementById('dirlist');
const useFolderBtn = document.getElementById('use_folder');

let currentPath = (targetInput.value || "").replace(/^\/+|\/+$/g, "");

function setStatus(msg, cls="muted") {
  statusEl.className = "center " + cls; statusEl.textContent = msg;
}

dz.addEventListener('click', () => fi.click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('dragover');
  fi.files = e.dataTransfer.files;
  setStatus(`${fi.files.length} file(s) queued.`);
});

browseBtn.addEventListener('click', async () => {
  browser.classList.toggle('hidden');
  if (!browser.classList.contains('hidden')) {
    await refreshDir(currentPath);
  }
});
useFolderBtn.addEventListener('click', () => {
  targetInput.value = currentPath;
  browser.classList.add('hidden');
});

async function refreshDir(relpath) {
  const qp = new URLSearchParams({ path: relpath || "" });
  const r = await fetch(`/api/dirs?${qp.toString()}`);
  if (!r.ok) { setStatus("Failed to load directories.", "error"); return; }
  const data = await r.json();
  currentPath = data.path || "";
  // Breadcrumbs
  crumbs.innerHTML = "";
  data.breadcrumbs.forEach((c, idx) => {
    const a = document.createElement('a');
    a.href = "#";
    a.textContent = c.label;
    a.addEventListener('click', (e) => { e.preventDefault(); refreshDir(c.relpath); });
    crumbs.appendChild(a);
    if (idx < data.breadcrumbs.length - 1) {
      const s = document.createElement('span'); s.textContent = "›"; s.style.margin = "0 4px"; crumbs.appendChild(s);
    }
  });
  // Directories
  dirlist.innerHTML = "";
  // Up link (..)
  if (currentPath) {
    const up = currentPath.split('/').slice(0, -1).join('/');
    const upDiv = document.createElement('div');
    upDiv.className = 'dir';
    upDiv.textContent = '⬆︎ ..';
    upDiv.addEventListener('click', () => refreshDir(up));
    dirlist.appendChild(upDiv);
  }
  data.dirs.forEach(d => {
    const div = document.createElement('div');
    div.className = 'dir';
    div.textContent = '📁 ' + d.name;
    div.addEventListener('click', () => refreshDir(d.relpath));
    dirlist.appendChild(div);
  });
}

upBtn.addEventListener('click', async () => {
  if (!fi.files || fi.files.length === 0) {
    // On mobile, if no files selected, trigger picker
    fi.click();
    setStatus("Choose files to upload.");
    return;
  }
  const form = new FormData();
  for (const f of fi.files) form.append('files', f);
  form.append('target_dir', targetInput.value || "");

  setStatus("Uploading…");
  try {
    const r = await fetch('/upload', { method: 'POST', body: form });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    const count = data.saved.length;
    setStatus(`✅ Uploaded ${count} file(s) to /${data.target_dir || ""}`, "success");
    // Clear selection
    fi.value = '';
  } catch (e) {
    setStatus("Upload failed: " + e.message, "error");
  }
});
</script>
</body>
</html>
